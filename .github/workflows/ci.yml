name: Bootcamp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bootcamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q
